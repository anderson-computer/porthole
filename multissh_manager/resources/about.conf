# MultiSSH Manager - About tab configuration.
#
# Controls what the Help > About tab shows. Rather than editing this
# bundled file, create an override at one of these locations (checked in
# order, each overriding the previous one field by field):
#   1. This file (bundled default)
#   2. /etc/multissh-manager/about.conf        (system-wide)
#   3. ~/.config/multissh-manager/about.conf   (per-user)
#
# Blank values fall back to the built-in default. Lines starting with # are
# ignored. version defaults to the installed package version.

app_name=MultiSSH Manager
author=
tagline=Tabbed SSH session manager for Linux
link_label=Project page
link_url=
# Absolute path to a .png or .svg; the bundled logo is used if unset.
logo_path=
